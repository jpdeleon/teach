name: Deploy Jupyter Books to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Build root book
        run: uv run jupyter-book build .

      - name: Build Theoretical Physics sub-book
        run: uv run jupyter-book build physics/theoretical

      - name: Build Applied Physics sub-book
        run: uv run jupyter-book build physics/applied

      - name: Build General Physics sub-book
        run: uv run jupyter-book build physics/general

      - name: Build Astronomy sub-book
        run: uv run jupyter-book build astronomy

      - name: Build Data Analysis sub-book
        run: uv run jupyter-book build observation_data_analysis

      - name: Build Space & Earth Science sub-book
        run: uv run jupyter-book build space_earth_science

      - name: Build Statistics & Algorithms sub-book
        run: uv run jupyter-book build statistics_algorithms

      - name: Build Philosophy sub-book
        run: uv run jupyter-book build philosophy_teaching

      - name: Assemble site
        run: |
          set -e
          rm -rf _site
          mkdir -p _site/physics/theoretical
          mkdir -p _site/physics/applied
          mkdir -p _site/physics/general
          mkdir -p _site/astronomy
          mkdir -p _site/observation_data_analysis
          mkdir -p _site/space_earth_science
          mkdir -p _site/statistics_algorithms
          mkdir -p _site/philosophy_teaching
          cp -r _build/html/. _site/
          cp -r physics/theoretical/_build/html/. _site/physics/theoretical/
          cp -r physics/applied/_build/html/. _site/physics/applied/
          cp -r physics/general/_build/html/. _site/physics/general/
          cp -r astronomy/_build/html/. _site/astronomy/
          cp -r observation_data_analysis/_build/html/. _site/observation_data_analysis/
          cp -r space_earth_science/_build/html/. _site/space_earth_science/
          cp -r statistics_algorithms/_build/html/. _site/statistics_algorithms/
          cp -r philosophy_teaching/_build/html/. _site/philosophy_teaching/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
