[project]
name = "teach"
version = "0.1.0"
description = "Course materials for physics, astronomy, data analysis, and statistics"
authors = [{name = "Jerome de Leon", email = "jpdeleon@example.com"}]
readme = "README.md"
license = {text = "CC-BY-4.0"}
requires-python = ">=3.10"
dependencies = [
    "jupyter-book<2",
    "matplotlib",
    "numpy",
    "astropy",
    "astroquery",
    "pandas",
    "scipy",
    "emcee",
    "corner",
    "dynesty",
    "ultranest",
    "bilby",
    "pymc",
    "bambi",
    "arviz",
    "tinygp",
    "specutils",
    "photutils",
    "lightkurve",
    "sphinx-autobuild>=2024.10.3",
    "plotly",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# This project is course content (docs/notebooks), not an importable Python
# package. Disable setuptools' automatic package discovery so adding new
# top-level content directories (physics/, astronomy/, ...) never breaks
# the build with an ambiguous "multiple top-level packages" error.
packages = []

[tool.uv.sources]
# Use local development versions if needed
# jupyter-book = {path = "../jupyter-book", editable = true}
